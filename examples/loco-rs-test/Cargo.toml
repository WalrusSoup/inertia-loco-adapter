[package]
name = "loco-rs-test"
version = "0.1.0"
edition = "2021"

[dependencies]
loco-rs = "1.2"
loco-inertia = { path = "../.." }
sea-orm = { version = "2.0", default-features = false, features = ["macros"] }
sample-migration = { path = "migration" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }





